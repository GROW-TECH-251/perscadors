name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze JavaScript and TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3.28.1
        with:
          languages: javascript-typescript
          build-mode: none
          # Ignore les assets binaires 67M qui ne sont pas du code
          paths-ignore: |
            public/assets/**
            public/**
            node_modules/**
            .next/**
            **/*.jpeg
            **/*.jpg
            **/*.png
            **/*.mp4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3.28.1
        with:
          category: "/language:javascript-typescript"