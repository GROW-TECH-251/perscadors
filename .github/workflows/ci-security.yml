name: CI Security Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-dependencies:
    name: Quality, build and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Check whitespace and conflict markers
        run: |
          if git rev-parse HEAD^ >/dev/null 2>&1; then
            git diff --check HEAD^ HEAD || echo "Whitespace check: warnings found but not blocking for merge"
          else
            echo "No parent, skipping whitespace check"
          fi

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Dependency audit
        run: npm audit --audit-level=high

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 1

      - name: Scan current files only (not full history)
        uses: gitleaks/gitleaks-action@v2.3.8
        with:
          args: --no-git --source . --config gitleaks.toml -v --redact --no-banner
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}